name: Business Rule Protocol

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  declaration:
    name: Business Rule Declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate PR business-rule record
        run: node scripts/check-business-rule-pr.js
